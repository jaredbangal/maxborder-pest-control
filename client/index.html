    <script>
      // Runs before first paint. Reads the saved choice (or falls back to the
      // OS setting) and stamps <html> so the correct palette is already in
      // place when the page renders — no flash of the wrong theme.
      (function () {
        try {
          var saved = localStorage.getItem('mb-theme');
          var dark =
            saved === 'dark' ||
            (saved !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.setAttribute('data-theme', saved);
          }
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#0e1720' : '#f4eee0');
        } catch (e) {
          /* storage blocked — fall through to the media query */
        }
      })();
    </script>
